<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>
        {% block title %}バスケログ{% endblock %}
    </title>

    {% load static %}

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

</head>
<body>

<nav class="navbar fixed-top shadow-sm app-header">

    <div class="app-header-inner">

        <div class="header-left">
            <a href="{% url 'accounts:home' %}">
                <i class="bi bi-house-door-fill fs-3"></i>
            </a>
        </div>

        <div class="header-title">
            <a href="{% url 'accounts:home' %}"
            class="text-decoration-none text-white fw-bold fs-3">                
                バスケログ
            </a>
        </div>

        <div class="header-right">

            {% if user.is_authenticated %}

                <a href="{% url 'accounts:mypage' %}">
                    <i class="bi bi-person-circle fs-3 mypage-icon"></i>
                </a>

                <button type="button"
                        class="logout-button"
                        data-bs-toggle="modal"
                        data-bs-target="#logoutModal">
                    <i class="bi bi-box-arrow-right fs-3"></i>
                </button>
                
            {% endif %}

        </div>

    </div>

</nav>


<div class="container mt-3">
    {% if messages %}        
        <div class="message-area">

    {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
            {{ message }}

            <button type="button"
                    class="btn-close"
                    data-bs-dismiss="alert"></button>
        </div>
    {% endfor %}

</div>
    {% endif %}

    <main class="pt-5 mt-3 pb-5 mb-5">

        {% block content %}
        {% endblock %}

    </main>

    {% if user.is_authenticated %}

    <div class="modal fade" id="logoutModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">

                <div class="modal-body text-center">
                    <p class="mb-4">ログアウトしますか？</p>

                    <form action="{% url 'accounts:user_logout' %}" method="post">
                        {% csrf_token %}

                        <button type="submit"
                                class="btn logout-confirm-btn">
                            はい
                        </button>

                        <button type="button"
                                class="btn logout-cancel-btn"
                                data-bs-dismiss="modal">
                            いいえ
                        </button>
                    </form>

                </div>

            </div>
        </div>
    </div>

{% endif %}

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<footer class="navbar fixed-bottom app-footer py-2">

    <div class="container d-flex justify-content-around text-center">

        <a href="{% url 'games:diary_create' %}"
           class="text-decoration-none">

            <img src="{% static 'images/footer_record.png' %}"
                class="footer-icon"
                alt="観戦を記録する"><br>
            <small>観戦を記録する</small>

        </a>

        <a href="{% url 'games:diary_list' %}"
           class="text-decoration-none">

            <img src="{% static 'images/footer_myrecord.png' %}"
                class="footer-icon"
                alt="MY観戦記録"><br>
            <small>MY観戦記録</small>

        </a>

        <a href="{% url 'spots:arena_list' %}"
           class="text-decoration-none">

            <img src="{% static 'images/footer_arena.png' %}"
                class="footer-icon"
                alt="アリーナ情報"><br>
            <small>アリーナ情報</small>

        </a>

    </div>

</footer>

</body>
</html>
